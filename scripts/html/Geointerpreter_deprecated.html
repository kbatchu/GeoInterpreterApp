<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geointerpreter</title>   
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/fontgis.min.css"> <!-- https://viglino.github.io/font-gis/ -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">	 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	 <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        #container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #analysis-output {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            white-space: pre-wrap; /* To preserve formatting from the LLM */
            min-height: 100px;
        }
        .loader {
            border: 5px solid #f3f3f3; /* Light grey */
            border-top: 5px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none; /* Hidden by default */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
	
	<style>
        body { font-family: sans-serif; padding: 2em; }
        #map-placeholder { height: 300px; background-color: #e9e9e9; border: 1px solid #ccc; text-align: center; line-height: 300px; color: #777; }
        #analysis-output { margin-top: 1em; padding: 1em; border: 1px solid #ddd; background-color: #f9f9f9; white-space: pre-wrap; }
        button { padding: 0.8em 1.2em; font-size: 1em; cursor: pointer; }
    </style>
</head>

<body>
 <div id="container">
        <h1>Geospatial Data Interpreter</h1>
        <p>Click the button to analyze the sample map data using a Small Language Model running in your browser.</p>
        <button id="analyze-button">Analyze Map Data</button>
        <div id="loader" class="loader"></div>
        <h2>Analysis Output:</h2>
        <div id="analysis-output">Click the button to see the analysis.</div>
    </div> 
    

    <script type="module" async src="scripts/geointerpreter_entryapp.js"></script>
</body>

</html>
